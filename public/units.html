<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apartment Management — Available Residences</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <meta name="theme-color" content="#c2593f" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css" />
  <script src="theme-check.js"></script>
</head>
<body class=" min-h-screen">

  <!-- Navbar -->
  <div id="app-navbar"></div>

  <main class="max-w-7xl mx-auto px-6 md:px-12 py-10 space-y-8">

    <!-- Header Actions -->
    <div class="flex flex-wrap items-end justify-between gap-4 border-b border-[#dfd9cd] pb-6">
      <div>
        <span class="micro-label block mb-1">PROPERTY RESIDENCES</span>
        <h1 class="font-serif text-4xl md:text-5xl font-light text-[#1c1a17]">Available Units</h1>
      </div>
    </div>

    <!-- Filters & Table Card -->
    <div class="editorial-card p-8">
      <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
        <div class="flex items-center gap-2">
          <button id="btn-status-all" class="px-4 py-1.5 rounded-full text-xs font-semibold bg-[#1c1a17] text-[#fbf9f4]">All Units</button>
          <button id="btn-status-occupied" class="px-4 py-1.5 rounded-full text-xs font-semibold bg-[#ede9df] opacity-70 hover:text-[#1c1a17]">Occupied</button>
          <button id="btn-status-vacant" class="px-4 py-1.5 rounded-full text-xs font-semibold bg-[#ede9df] opacity-70 hover:text-[#1c1a17]">Vacant</button>
          <button id="btn-status-maintenance" class="px-4 py-1.5 rounded-full text-xs font-semibold bg-[#ede9df] opacity-70 hover:text-[#1c1a17]">Maintenance</button>
        </div>
        
        <div class="relative">
          <input type="text" id="search-units" placeholder="Search unit #..." class="px-4 py-2 rounded-full border border-[#dfd9cd] text-xs w-64 bg-[#ede9df]/40 focus:outline-none focus:ring-1 focus:ring-[#c2593f]" />
        </div>
      </div>

      <!-- Table -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="border-b border-[#dfd9cd] opacity-50 font-semibold uppercase tracking-widest text-[10px]">
              <th class="pb-3">Unit #</th>
              <th class="pb-3">Floor</th>
              <th class="pb-3">Rent Rate</th>
              <th class="pb-3">Status</th>
              <th class="pb-3">Occupancy details</th>
            </tr>
          </thead>
          <tbody id="units-table-body" class="divide-y divide-[#dfd9cd]/60 font-medium">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="app.js"></script>
  <script src="pages/units.js"></script>
</body>
</html>
