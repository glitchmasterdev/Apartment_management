<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nairobi Rentals — Reset Password</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <meta name="theme-color" content="#c2593f" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css" />
  <script>(function(){if(localStorage.getItem('nrb_theme')==='dark')document.documentElement.classList.add('dark');})()</script>
</head>
<body class="bg-[#fbf9f4] text-[#1c1a17] min-h-screen flex flex-col justify-between transition-colors duration-300 dark:bg-[#121110] dark:text-[#ede9df]">

  <!-- Top Decorative Header -->
  <header class="py-6 px-6 md:px-16 border-b border-[#dfd9cd] flex items-center justify-between dark:border-[#2d2a26]">
    <a href="/index.html" class="font-serif text-xl tracking-tight text-[#1c1a17] dark:text-[#ede9df]">
      Nairobi <span class="text-[#c2593f]">Rentals</span>
    </a>
    <a href="/index.html" class="text-xs font-semibold uppercase tracking-widest text-[#c2593f] hover:underline">
      Home
    </a>
  </header>

  <!-- Content Area -->
  <main class="flex-grow flex items-center justify-center p-6">
    <div class="editorial-card bg-[#fbf9f4] border border-[#dfd9cd] rounded-2xl w-full max-w-md p-8 relative dark:bg-[#1c1a17] dark:border-[#2d2a26] shadow-xl">
      <div class="text-center mb-8">
        <div class="w-12 h-12 rounded-full bg-[#ede9df] dark:bg-[#2d2a26] mx-auto flex items-center justify-center mb-4">
          <i data-lucide="key-round" class="w-6 h-6 text-[#c2593f]"></i>
        </div>
        <h2 class="font-serif text-3xl font-light text-[#1c1a17] dark:text-[#ede9df] mb-2">Set New Password</h2>
        <p class="text-sm text-[#1c1a17]/60 dark:text-[#ede9df]/60">Please enter and confirm your new password below.</p>
      </div>

      <form id="reset-pw-form" class="space-y-5">
        <div>
          <label class="micro-label block mb-1.5 dark:text-[#ede9df]/50">New Password</label>
          <div style="position:relative;">
            <input id="rp-password" type="password" required placeholder="At least 8 chars, letters &amp; numbers"
              class="w-full border border-[#dfd9cd] rounded-xl px-4 py-3 pr-10 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#c2593f]/40 dark:border-[#2d2a26] dark:bg-[#121110] dark:focus:ring-[#c2593f]/35" />
            <button type="button" onclick="togglePasswordVisibility('rp-password', this)" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer;color:var(--fg-ink);opacity:0.45;outline:none;padding:4px;display:flex;align-items:center;">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <div>
          <label class="micro-label block mb-1.5 dark:text-[#ede9df]/50">Confirm New Password</label>
          <div style="position:relative;">
            <input id="rp-confirm" type="password" required placeholder="Confirm your new password"
              class="w-full border border-[#dfd9cd] rounded-xl px-4 py-3 pr-10 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#c2593f]/40 dark:border-[#2d2a26] dark:bg-[#121110] dark:focus:ring-[#c2593f]/35" />
            <button type="button" onclick="togglePasswordVisibility('rp-confirm', this)" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer;color:var(--fg-ink);opacity:0.45;outline:none;padding:4px;display:flex;align-items:center;">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div id="rp-message" class="text-sm p-3.5 rounded-xl hidden"></div>

        <button type="submit" class="w-full btn-terracotta justify-center py-3 text-sm font-semibold rounded-full shadow-md hover:shadow-lg transition duration-200">
          Update Password &amp; Login
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-6 text-center border-t border-[#dfd9cd] dark:border-[#2d2a26]">
    <p class="text-xs text-[#1c1a17]/40 dark:text-[#ede9df]/40">© 2026 Nairobi Rentals. All rights reserved.</p>
  </footer>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Parse query token
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const form = document.getElementById('reset-pw-form');
    const msgEl = document.getElementById('rp-message');

    function showMessage(text, isError = false) {
      msgEl.textContent = text;
      msgEl.className = `text-sm p-3.5 rounded-xl ${isError ? 'bg-red-50 text-red-700 dark:bg-red-950/20 dark:text-red-400' : 'bg-green-50 text-green-700 dark:bg-green-950/20 dark:text-green-400'}`;
      msgEl.classList.remove('hidden');
    }

    if (!token) {
      showMessage('Invalid or missing security token. Please request a new password reset link.', true);
      form.querySelector('button[type="submit"]').disabled = true;
      form.querySelector('button[type="submit"]').style.opacity = '0.5';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgEl.classList.add('hidden');

      const password = document.getElementById('rp-password').value;
      const confirm = document.getElementById('rp-confirm').value;

      if (password !== confirm) {
        showMessage('Passwords do not match.', true);
        return;
      }

      if (password.length < 8) {
        showMessage('Password must be at least 8 characters long.', true);
        return;
      }
      if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) {
        showMessage('Password must contain both letters and numbers.', true);
        return;
      }

      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ token, new_password: password })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || 'Failed to reset password.');
        }

        showMessage('Password reset successfully! Redirecting you to login...');
        setTimeout(() => {
          window.location.href = '/index.html?login=true';
        }, 2000);
      } catch (err) {
        showMessage(err.message, true);
      }
    });

    function togglePasswordVisibility(inputId, btnEl) {
      const input = document.getElementById(inputId);
      const icon = btnEl.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }
  </script>
</body>
</html>
