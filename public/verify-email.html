<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Email</title><link rel="stylesheet" href="styles.css"></head><body><main style="max-width:560px;margin:10vh auto;padding:2rem"><section class="editorial-card" style="padding:2rem"><h1>Email verification</h1><p id="message">Verifying your email…</p><a id="portal-link" href="/tenant-portal.html" style="display:none">Return to Tenant Portal</a></section></main><script>const p=new URLSearchParams(location.search),m=document.getElementById('message');fetch('/api/auth/verify-email?token='+encodeURIComponent(p.get('token')||''),{credentials:'include'}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.detail);m.textContent=d.message;document.getElementById('portal-link').style.display='inline'}).catch(e=>m.innerHTML=`${e.message} Please return to the Tenant Portal and contact your property manager for a new verification email.`)</script></body></html>
